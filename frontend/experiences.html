<!doctype html>
<!-- Experience list: the trip from GET /api/trips/{id}: progress while it is being researched, then the experiences with price, source and checked-at time; Keep/Remove/time changes go to the API, which re-runs the checks and the budget. Swap and Quick search ask the API for 2-3 checked options; the user picks one. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your experiences · Travel Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/api.js" defer></script>
  <script src="js/experiences.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="wordmark" href="index.html">Travel Planner</a>
      <nav class="site-nav" aria-label="Trip">
        <a class="link-underline" href="plan.html">Edit my answers</a>
      </nav>
    </div>
  </header>

  <main class="container page">
    <div class="page-head">
      <h1 id="title">Your experiences</h1>
      <p class="body-lg muted" id="subtitle"></p>
      <p class="field-error" id="action-error" role="alert" hidden></p>
    </div>

    <div class="with-aside">
      <div class="main">
        <section class="card" id="status" aria-live="polite" hidden></section>
        <section class="card search-panel" id="search-panel" aria-live="polite" aria-labelledby="search-title" tabindex="-1" hidden></section>
        <div class="card-grid" id="kept-grid"></div>
        <div class="removed-list" id="removed-list" hidden></div>
        <section class="card quick-search" id="quick-search" aria-labelledby="quick-title" hidden>
          <h2 class="h3" id="quick-title">Something last-minute?</h2>
          <p class="caption">Ask for one thing on one day. We search the sources and check what we find; nothing is invented.</p>
          <form class="quick-form" id="quick-form" novalidate>
            <div class="field-row">
              <label class="field quick-request">
                <span class="field-label">What are you looking for?</span>
                <input class="input" id="quick-request" name="request" type="text" minlength="3" maxlength="300" placeholder="e.g. a wine tasting" autocomplete="off" required>
              </label>
              <label class="field quick-day">
                <span class="field-label">Day</span>
                <select class="input" id="quick-day" name="day"></select>
              </label>
            </div>
            <p class="field-error" id="quick-error" role="alert" hidden></p>
            <div>
              <button type="submit" class="btn btn-primary btn-sm" id="quick-go">Search</button>
            </div>
          </form>
        </section>
        <button type="button" class="btn btn-secondary btn-accent btn-block more-ideas" aria-disabled="true" title="Coming soon">
          <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
          More ideas
        </button>
      </div>

      <aside class="aside-wide">
        <section class="card budget" id="budget" aria-labelledby="budget-title" hidden>
          <h2 id="budget-title">Your budget</h2>
          <div class="budget-meter">
            <div class="budget-head">
              <p><span class="amount" id="budget-used"></span><span class="of" id="budget-of"></span></p>
              <p class="caption" id="budget-per"></p>
            </div>
            <div class="budget-track" id="budget-track" role="progressbar" aria-label="Budget used" aria-valuemin="0">
              <div class="budget-fill" id="budget-fill"></div>
            </div>
            <p class="budget-left" id="budget-left" aria-live="polite"></p>
          </div>
          <hr class="divider">
          <div>
            <p class="kept-title" id="kept-title"></p>
            <ul class="plain kept-list" id="kept-list"></ul>
            <p class="caption" id="not-counted" hidden></p>
          </div>
          <div class="budget-actions">
            <button type="button" class="btn btn-primary btn-lg btn-block" id="build">Build my trip</button>
            <button type="button" class="btn btn-secondary btn-block" id="fit" hidden>Fit it to my budget</button>
          </div>
          <p class="caption">If you go over budget the bar turns red, this button switches off and "Fit it to my budget" appears.</p>
        </section>
      </aside>
    </div>
  </main>
</body>
</html>
